[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# Phase 1: 通信层迁移依赖
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# 显式启用 tracing 的 log 桥接:后端统一用 tracing::info!/warn! 记录,而 tauri-plugin-log 捕获的是
# `log` facade。本项目未注册任何 tracing Subscriber,后端日志能落盘完全依赖 tracing→log 桥接;此前该桥接
# 仅由 sqlx 等依赖传递性开启,上游一旦调整就会静默断链。用 log-always 显式钉死,确保 tracing 事件始终产出
# log 记录(即便日后引入 tracing Subscriber 也不会把事件从 log 侧夺走)。
tracing = { version = "0.1", features = ["log-always"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.22"
toml = "0.8"
dirs = "6"
portable-pty = "0.8"
sysinfo = "0.33"
zip = "2"
futures-util = "0.3"
# 麦麦活动(在途会话)实时桥:订阅 MaiBot WebUI 统一 WebSocket(maisaka_monitor 域)。
# 仅连本机 ws://(无 TLS),故关掉默认 TLS 特性,只留明文连接 + 握手。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
sha2 = "0.10.9"
# MaiBot bot.py check_eula 用 MD5(EULA.md/PRIVACY.md 内容) 作为 EULA_AGREE/PRIVACY_AGREE 的确认值
md-5 = "0.10"
# NapCat 登录二维码 PNG → data URL,推前端展示
base64 = "0.22"
# 自更新"选版本安装":用 updater 公钥验 Tauri 产出的 .sig 签名(minisign 格式)
minisign-verify = "0.2"

# Windows 专属底层查询(仅 Windows 编译):
#   - Performance: PDH 读 \System\Processor Queue Length 算平均负载
#   - SystemInformation: GetSystemFirmwareTable 读 SMBIOS Type 17 取内存频率/类型
#   - Power: CallNtPowerInformation(ProcessorInformation) 取每核 CurrentMhz 实时主频
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
