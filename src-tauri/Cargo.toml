[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# Phase 1: 通信层迁移依赖
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.22"
toml = "0.8"
dirs = "6"
portable-pty = "0.8"
sysinfo = "0.33"
zip = "2"
futures-util = "0.3"
sha2 = "0.10.9"
# MaiBot bot.py check_eula 用 MD5(EULA.md/PRIVACY.md 内容) 作为 EULA_AGREE/PRIVACY_AGREE 的确认值
md-5 = "0.10"
# NapCat 登录二维码 PNG → data URL,推前端展示
base64 = "0.22"

# Windows 专属底层查询(仅 Windows 编译):
#   - Performance: PDH 读 \System\Processor Queue Length 算平均负载
#   - SystemInformation: GetSystemFirmwareTable 读 SMBIOS Type 17 取内存频率/类型
#   - Power: CallNtPowerInformation(ProcessorInformation) 取每核 CurrentMhz 实时主频
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
